aid: nitricity
name: Nitricity
description: >-
  Nitricity is a climate-tech and agricultural-technology company that produces
  nitrogen fertilizer on-farm from only air, water, and renewable electricity.
  Founded in 2018 by Stanford graduate researchers Nicolas Pinkowski and Joshua
  McEnaney, the company uses a solar-powered plasma / electrochemical process to
  fix atmospheric nitrogen and produce nitric acid and calcium nitrate
  fertilizers on-site and on-demand, eliminating the fossil-fuel-intensive
  Haber-Bosch process and long-distance transportation that make conventional
  fertilizer responsible for roughly 5% of global greenhouse gas emissions.
  Backed by Khosla Ventures, Fine Structure Ventures, Lowercarbon Capital, and
  strategic investor Chipotle, Nitricity is a hardware and physical-product
  company; it publishes a corporate website, blog, and field-trial program but
  exposes no public API, developer portal, or technical integration surface.
